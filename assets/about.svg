<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img"><style>
.r{opacity:0;animation:r 1s ease forwards}
@keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.f{animation:fl 1.6s linear infinite}
@keyframes fl{to{stroke-dashoffset:-14}}
.p{animation:pu 3.6s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:.9}}
.a{stroke-dasharray:190;stroke-dashoffset:190;animation:ar 1.8s .4s ease forwards}
@keyframes ar{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0d"/><stop offset="1" stop-color="#17171b"/></linearGradient>
