<text x="40" y="272" text-anchor="start" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" letter-spacing="0" fill="#8a8a8f" >From national-scale geospatial pipelines at Sri Lanka Telecom</text>
<text x="40" y="294" text-anchor="start" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" letter-spacing="0" fill="#8a8a8f" >to full-stack platforms and data workflows, I work on</text>
<text x="40" y="316" text-anchor="start" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" letter-spacing="0" fill="#8a8a8f" >problems shaped by real operational needs.</text>
<text x="40" y="356" text-anchor="start" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" letter-spacing="2.5" fill="#c9b37e" >DATA SCIENCE · GEOSPATIAL · FULL-STACK · RESEARCH</text>
