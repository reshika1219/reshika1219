<text x="40" y="194" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="0" fill="#e8d9b0" >survive contact with <tspan fill="#c9b37e" font-style="italic">reality.</tspan></text>
