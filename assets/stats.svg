<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img"><title>Key numbers: 141,000 fibre points; 51 to 17 variables; 471 participants; AUC above 0.99</title><rect width="1000" height="200" fill="#f2f0eb"/><rect x="40" y="30" width="210" height="4" fill="#111111"/><rect x="40" y="30" width="44" height="4" fill="#e30613"/><text x="40" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="-1.5" fill="#111111">141,000</text><text x="40" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">Fibre points across</text><text x="40" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">~14,000 hexagons</text><rect x="280" y="30" width="210" height="4" fill="#111111"/><rect x="280" y="30" width="44" height="4" fill="#e30613"/><text x="280" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="-1.5" fill="#111111">51 → 17</text><text x="280" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">Raw variables engineered</text><text x="280" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">into features</text><rect x="520" y="30" width="210" height="4" fill="#111111"/><rect x="520" y="30" width="44" height="4" fill="#e30613"/><text x="520" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="-1.5" fill="#111111">471</text><text x="520" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">Participants in a</text><text x="520" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">visualization A/B study</text><rect x="760" y="30" width="210" height="4" fill="#111111"/><rect x="760" y="30" width="44" height="4" fill="#e30613"/><text x="760" y="112" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="-1.5" fill="#111111">&gt;0.99</text><text x="760" y="150" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">AUC on</text><text x="760" y="170" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#111111">churn prediction</text></svg>