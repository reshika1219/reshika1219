<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img"><style>.l{animation:dr 2.4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.t{opacity:0;animation:f .9s ease forwards}
@keyframes f{to{opacity:1}}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect width="1000" height="280" fill="#0b0b0d"/>
<rect x="0.5" y="0.5" width="999" height="279" fill="none" stroke="#26262b"/>
